services:
  # ─── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fotoin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fotoin}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fotoin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache / Broker ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fotoin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── S3-Compatible Object Storage (MinIO) ──────────────────────────────────
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: fotoin-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ─── Backend API (Golang Echo) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fotoin-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_ENV: "${APP_ENV:-development}"
      APP_SECRET: "${APP_SECRET:-fotoin-jwt-super-secret-key-change-in-production-2026}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-fotoin}"
      DB_SSLMODE: "disable"
      URL_REDIS: "redis://redis:6379/0"
      # S3 / MinIO Settings
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-fotoin-bucket}"
      AWS_S3_ENDPOINT: "http://minio:9000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
      # Payment & Third-Party (Optional in local development)
      MIDTRANS_ENV: "${MIDTRANS_ENV:-sandbox}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-}"
      DUIDKU_ENV: "${DUIDKU_ENV:-sandbox}"
      DUIDKU_APIKEY: "${DUIDKU_APIKEY:-}"
      DUIDKU_MERCHANTCODE: "${DUIDKU_MERCHANTCODE:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # ─── Dashboard (React + Vite + Nginx) ────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fotoin-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ─── Client App (Next.js 16) ────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    container_name: fotoin-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
      NODE_ENV: "production"
    depends_on:
      - backend

# ─── Persistent Volumes ───────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:
